<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pago')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <h2 class="mb-4">
        <i class="fa-solid fa-credit-card text-primary"></i> Pago
    </h2>

    <form class="card p-4 shadow-sm">

        <!-- Datos del comprador -->
        <h5 class="mb-3 text-secondary">Datos del comprador</h5>
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Nombre completo</label>
                <input type="text" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" required>
            </div>
        </div>

        <!-- Dirección -->
        <h5 class="mb-3 text-secondary">Dirección de envío</h5>
        <div class="row mb-3">
            <div class="col-md-8">
                <label class="form-label">Dirección</label>
                <input type="text" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Ciudad</label>
                <input type="text" class="form-control" required>
            </div>
        </div>

        <!-- Pago -->
        <h5 class="mb-3 text-secondary">Método de pago</h5>
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Número de tarjeta</label>
                <input type="text" class="form-control" maxlength="16" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Fecha vencimiento</label>
                <input type="text" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">CVV</label>
                <input type="text" class="form-control" maxlength="3" required>
            </div>
        </div>

        <!-- TOTAL -->
        <hr class="my-4">
        <div class="d-flex justify-content-end align-items-center mb-3">
            <h4 class="me-3">Total a pagar:</h4>
            <h4 class="text-success" id="total-pagar">$0</h4>
        </div>

        <!-- BOTONES -->
        <div class="d-flex justify-content-between align-items-center mt-2">
            <a th:href="@{/cliente/cart}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left"></i> Volver al carrito
            </a>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-check"></i> Confirmar compra
            </button>
        </div>

    </form>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

<!-- 🔥 ESTA LÍNEA ES OBLIGATORIA -->
<script src="/js/script.js"></script>

</body>
</html>
