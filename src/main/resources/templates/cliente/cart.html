<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Carrito')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/footer :: alertas}"></div>

<div class="container py-4">
    <h2 class="mb-4">
        <i class="fa-solid fa-shopping-cart text-success"></i> Carrito de compras
    </h2>

    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cart-items"></tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4">
        <a th:href="@{/cliente/inventario}" class="btn btn-outline-primary">
            <i class="fa-solid fa-store"></i> Seguir comprando
        </a>
        <div>
            <h4 class="mb-3">Total: <span id="cart-total">$0</span></h4>
           <a th:href="@{/cliente/checkout}" class="btn btn-primary">
                <i class="fa-solid fa-credit-card"></i> Ir al pago
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
<script src="/js/script.js"></script>
</body>
</html>
