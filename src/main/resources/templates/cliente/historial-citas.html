<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Historial de Citas')}">
</head>

<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div th:replace="~{fragments/footer :: alertas}"></div>

    <div class="container py-4">

        <h2 class="mb-4">

            <i class="fa-solid fa-clock-rotate-left text-primary"></i>

            Historial de Citas

        </h2>


        <!-- FILTROS -->

        <form th:action="@{/cliente/historial-citas}" method="get" class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-5">

                        <label class="form-label">
                            Buscar
                        </label>

                        <input type="text" name="search" th:value="${search}" class="form-control"
                            placeholder="Buscar por servicio...">

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">
                            Estado
                        </label>

                        <select name="estado" class="form-select">

                            <option value="">
                                Todos
                            </option>

                            <option value="ATENDIDA" th:selected="${estado != null and estado.name() == 'ATENDIDA'}">

                                Atendida

                            </option>

                            <option value="CANCELADA" th:selected="${estado != null and estado.name() == 'CANCELADA'}">

                                Cancelada

                            </option>

                        </select>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">
                            Desde
                        </label>

                        <input type="date" name="fechaDesde" th:value="${fechaDesde}" class="form-control">

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">
                            Hasta
                        </label>

                        <input type="date" name="fechaHasta" th:value="${fechaHasta}" class="form-control">

                    </div>

                    <div class="col-12">

                        <button type="submit" class="btn btn-primary">

                            <i class="fa-solid fa-filter"></i>
                            Filtrar

                        </button>

                        <a th:href="@{/cliente/historial-citas}" class="btn btn-outline-secondary">

                            <i class="fa-solid fa-rotate-left"></i>
                            Limpiar

                        </a>

                    </div>

                </div>

            </div>

        </form>

        <div class="d-flex justify-content-end gap-2 mb-3">
            <a th:href="@{/cliente/historial-citas/reporte/pdf(search=${search},fechaDesde=${fechaDesde},fechaHasta=${fechaHasta},estado=${estado})}" class="btn btn-outline-danger"><i class="fa-solid fa-file-pdf"></i> PDF</a>
            <a th:href="@{/cliente/historial-citas/reporte/excel(search=${search},fechaDesde=${fechaDesde},fechaHasta=${fechaHasta},estado=${estado})}" class="btn btn-outline-success"><i class="fa-solid fa-file-excel"></i> Excel</a>
        </div>

        <!-- TABLA -->

        <div class="table-responsive">

            <table class="table table-hover align-middle bg-white shadow-sm">

                <thead class="table-primary">

                    <tr>

                        <th>#</th>
                        <th>Servicio</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="cita : ${citas}">

                        <td th:text="${cita.idCita}">
                        </td>

                        <td th:text="${cita.servicio != null
                        ? cita.servicio.nombre : '-'}">
                        </td>

                        <td th:text="${#temporals.format(
                        cita.fechaEntrada,
                        'dd/MM/yyyy HH:mm')}">
                        </td>

                        <td th:text="${#temporals.format(
                        cita.fechaSalida,
                        'dd/MM/yyyy HH:mm')}">
                        </td>

                        <td>

                            <span class="badge" th:classappend="'badge-estado-' +
                              ${#strings.toLowerCase(cita.estado)}" th:text="${cita.estado}">
                            </span>

                        </td>

                        <td class="text-end table-actions">

                            <a th:href="@{'/cliente/citas/' +
                            ${cita.idCita} + '/pdf'}" target="_blank" class="btn btn-sm btn-outline-danger"
                                title="PDF">

                                <i class="fa-solid fa-file-pdf"></i>

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(citas)}">

                        <td colspan="6" class="text-center text-muted py-4">

                            No tienes citas en tu historial.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <footer th:replace="~{fragments/footer :: footer}">
    </footer>

    <div th:replace="~{fragments/footer :: scripts}">
    </div>

</body>

</html>
