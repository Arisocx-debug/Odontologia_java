<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tienda')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/footer :: alertas}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">
            <i class="fa-solid fa-store text-primary"></i> Tienda de productos
        </h2>
       
    </div>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="item : ${items}">
            <div class="card card-servicio h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${item.nombre}"></h5>
                    <p class="text-muted mb-1" th:text="'Stock disponible: ' + ${item.stock}"></p>
                    <p class="fw-bold text-primary fs-5" th:text="'$ ' + ${item.precioUnitario}"></p>

                    <button 
                        class="btn btn-primary w-100 add-to-cart"
                        th:data-id="${item.idInventario}"
                        th:data-name="${item.nombre}"
                        th:data-price="${item.precioUnitario}"
                        th:data-stock="${item.stock}">
                        <i class="fa-solid fa-cart-plus"></i> Agregar al carrito
                    </button>
                </div>
            </div>
        </div>

        <div class="col-12" th:if="${#lists.isEmpty(items)}">
            <p class="text-muted">No hay productos disponibles por el momento.</p>
        </div>
    </div>
</div>



<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

<!-- Script del carrito -->
<script src="/js/script.js"></script>

</body>
</html>
