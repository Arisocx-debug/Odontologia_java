<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Inventario')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/footer :: alertas}"></div>

<div class="container py-4" th:with="base='/inventario'">
    <div th:replace="~{inventario/contenido :: contenido(${base})}"></div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

<!-- 🔥 Script del modal DEBE ir aquí -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const editarModal = document.getElementById("editarItem");

    if (!editarModal) {
        console.error("Modal editarItem no encontrado en el DOM");
        return;
    }

    editarModal.addEventListener("show.bs.modal", event => {
        const button = event.relatedTarget;

        const id = button.getAttribute("data-id");
        const nombre = button.getAttribute("data-nombre");
        const stock = button.getAttribute("data-stock");
        const precio = button.getAttribute("data-precio");
        const proveedor = button.getAttribute("data-proveedor");
        const descripcion = button.getAttribute("data-descripcion");
        const imagen = button.getAttribute("data-imagen");

        document.getElementById("idInventario").value = id;
        document.getElementById("nombre").value = nombre;
        document.getElementById("stock").value = stock;
        document.getElementById("precioUnitario").value = precio;
        document.getElementById("nombreProveedor").value = proveedor;
        document.getElementById("descripcion").value = descripcion;
        document.getElementById("imagenActual").src = imagen || "/img/producto-default.svg";

        // Mostrar/ocultar botón eliminar imagen
        const btnEliminarImagen = document.getElementById("btnEliminarImagen");
        const eliminarImagenInput = document.getElementById("eliminarImagen");

        if (imagen && imagen !== "/img/producto-default.svg") {
            btnEliminarImagen.style.display = "block";
            eliminarImagenInput.value = "false";
        } else {
            btnEliminarImagen.style.display = "none";
            eliminarImagenInput.value = "false";
        }

        // Acción correcta
        document.getElementById("formEditar").action = `/inventario/${id}`;
    });

    // Manejar clic en botón eliminar imagen
    const btnEliminarImagen = document.getElementById("btnEliminarImagen");
    if (btnEliminarImagen) {
        btnEliminarImagen.addEventListener("click", function() {
            const imagenActual = document.getElementById("imagenActual");
            const eliminarImagenInput = document.getElementById("eliminarImagen");

            // Cambiar a imagen por defecto
            imagenActual.src = "/img/producto-default.svg";
            eliminarImagenInput.value = "true";

            // Ocultar el botón de eliminar
            this.style.display = "none";
        });
    }
});
</script>

</body>
</html>
