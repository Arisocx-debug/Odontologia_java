<div th:fragment="contenido(base)">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-boxes-stacked text-primary"></i> Inventario</h2>

        <!-- Solo ADMIN puede crear -->
        <button class="btn btn-primary" sec:authorize="hasRole('ADMINISTRADOR')" 
                data-bs-toggle="modal" data-bs-target="#modalItem">
            <i class="fa-solid fa-plus"></i> Nuevo producto
        </button>
    </div>

    <form th:action="@{${base}}" method="get" class="row g-2 mb-4">
        <div class="col-md-8">
            <input type="text" name="buscar" th:value="${buscar}" class="form-control"
                   placeholder="Buscar por nombre o proveedor...">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-outline-primary w-100">Buscar</button>
        </div>
        <div class="col-md-2">
            <a th:href="@{${base}}" class="btn btn-outline-secondary w-100">Limpiar</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm">
            <thead class="table-primary">
            <tr>
                <th>#</th><th>Nombre</th><th>Stock</th><th>Precio unitario</th>
                <th>Proveedor</th><th>Estado</th><th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${items}">
                <td th:text="${i.idInventario}"></td>
                <td th:text="${i.nombre}"></td>
                <td th:text="${i.stock}"></td>
                <td th:text="'$ ' + ${i.precioUnitario}"></td>
                <td th:text="${i.nombreProveedor}"></td>

                <td>
                    <span class="badge"
                          th:classappend="${i.estado.name() == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${i.estado}">
                    </span>
                </td>

                <td class="text-end table-actions">

                    <!-- Editar solo ADMIN -->
                    <button class="btn btn-sm btn-outline-primary"
                            sec:authorize="hasRole('ADMINISTRADOR')"
                            data-bs-toggle="modal"
                            th:data-bs-target="'#editarItem' + ${i.idInventario}">
                        <i class="fa-solid fa-pen"></i>
                    </button>

                    <!-- Activar/Desactivar (ADMIN y EMPLEADO) -->
                    <form th:action="@{${base} + '/' + ${i.idInventario} + '/estado'}"
                          method="post" class="d-inline">
                        <input type="hidden" name="_method" value="patch">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-sm btn-outline-warning">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </form>

                    <!-- Eliminar solo ADMIN -->
                    <form th:action="@{${base} + '/' + ${i.idInventario}}"
                          sec:authorize="hasRole('ADMINISTRADOR')"
                          method="post" class="d-inline"
                          onsubmit="return confirm('Eliminar este producto?');">
                        <input type="hidden" name="_method" value="delete">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-sm btn-outline-dark">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </form>

                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="7" class="text-center text-muted py-4">
                    No hay productos en inventario.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal crear (solo ADMIN) -->
    <div class="modal fade" id="modalItem" tabindex="-1" sec:authorize="hasRole('ADMINISTRADOR')">
        <div class="modal-dialog">
            <form th:action="@{${base}}" method="post" class="modal-content">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Nombre</label>
                        <input name="nombre" class="form-control" required></div>

                    <div class="mb-3"><label class="form-label">Stock</label>
                        <input type="number" name="stock" class="form-control" required></div>

                    <div class="mb-3"><label class="form-label">Precio unitario</label>
                        <input type="number" step="0.01" name="precioUnitario" class="form-control" required></div>

                    <div class="mb-3"><label class="form-label">Proveedor</label>
                        <input name="nombreProveedor" class="form-control"></div>

                    <div class="mb-3"><label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control"></textarea></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal editar (solo ADMIN) -->
    <div class="modal fade" th:id="'editarItem' + ${i.idInventario}"
         th:each="i : ${items}" tabindex="-1" sec:authorize="hasRole('ADMINISTRADOR')">
        <div class="modal-dialog">
            <form th:action="@{${base} + '/' + ${i.idInventario}}" method="post" class="modal-content">
                <input type="hidden" name="_method" value="put">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="modal-header">
                    <h5 class="modal-title">Editar producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Nombre</label>
                        <input name="nombre" class="form-control" th:value="${i.nombre}" required></div>

                    <div class="mb-3"><label class="form-label">Stock</label>
                        <input type="number" name="stock" class="form-control" th:value="${i.stock}" required></div>

                    <div class="mb-3"><label class="form-label">Precio unitario</label>
                        <input type="number" step="0.01" name="precioUnitario"
                               class="form-control" th:value="${i.precioUnitario}" required></div>

                    <div class="mb-3"><label class="form-label">Proveedor</label>
                        <input name="nombreProveedor" class="form-control" th:value="${i.nombreProveedor}"></div>

                    <div class="mb-3"><label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control"
                                  th:text="${i.descripcion}"></textarea></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Actualizar</button>
                </div>
            </form>
        </div>
    </div>
</div>
