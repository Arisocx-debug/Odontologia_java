<div th:fragment="contenido(base)">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-boxes-stacked text-primary"></i> Inventario</h2>

        <button class="btn btn-primary"
                sec:authorize="hasRole('ADMINISTRADOR') or hasRole('EMPLEADO')"
                data-bs-toggle="modal"
                data-bs-target="#modalItem">
            <i class="fa-solid fa-plus"></i> Nuevo producto
        </button>
    </div>

    <!-- Buscador -->
    <form th:action="@{${base}}" method="get" class="row g-2 mb-4">
        <div class="col-md-8">
            <input type="text" name="buscar" th:value="${buscar}" class="form-control"
                   placeholder="Buscar por nombre o proveedor...">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-outline-primary w-100">Buscar</button>
        </div>
        <div class="col-md-2">
            <a th:href="@{${base}}" class="btn btn-outline-secondary w-100">Limpiar</a>
        </div>
    </form>

    <!-- Tabla -->
    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm">
            <thead class="table-primary">
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Stock</th>
                <th>Precio unitario</th>
                <th>Proveedor</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="i : ${items}">
                <td th:text="${i.idInventario}"></td>
                <td th:text="${i.nombre}"></td>

                <td style="white-space: normal; word-wrap: break-word;">
                    <span th:text="${i.descripcion}"></span>
                </td>

                <td th:text="${i.stock}"></td>
                <td th:text="'$ ' + ${i.precioUnitario}"></td>
                <td th:text="${i.nombreProveedor}"></td>

                <td>
                    <span class="badge"
                          th:classappend="${i.estado.name() == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${i.estado}">
                    </span>
                </td>

                <td class="text-end table-actions">

                    <!-- Editar -->
                    <button class="btn btn-sm btn-outline-primary"
                            sec:authorize="hasRole('ADMINISTRADOR')"
                            data-bs-toggle="modal"
                            data-bs-target="#editarItem"
                            th:data-id="${i.idInventario}"
                            th:data-nombre="${i.nombre}"
                            th:data-stock="${i.stock}"
                            th:data-precio="${i.precioUnitario}"
                            th:data-proveedor="${i.nombreProveedor}"
                            th:data-descripcion="${i.descripcion}">
                        <i class="fa-solid fa-pen"></i>
                    </button>

                    <!-- Activar/Desactivar -->
                    <form th:action="@{'/inventario/' + ${i.idInventario} + '/estado'}"
                          method="post" class="d-inline">
                        <input type="hidden" name="_method" value="patch">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <button type="submit"
                                th:class="'btn btn-sm ' + (${i.estado.name() == 'ACTIVO'} ? 'btn-outline-warning' : 'btn-outline-success')"
                                th:title="${i.estado.name() == 'ACTIVO'} ? 'Desactivar' : 'Activar'">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </form>

                    <!-- Eliminar -->
                    <form th:action="@{'/inventario/' + ${i.idInventario}}"
                          method="post" class="d-inline eliminar-form">
                        <input type="hidden" name="_method" value="delete">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('¿Seguro que deseas eliminar este producto?')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </form>

                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="8" class="text-center text-muted py-4">
                    No hay productos en inventario.
                </td>
            </tr>

            </tbody>
        </table>
    </div>

    <!-- Modal crear -->
    <div class="modal fade" id="modalItem" tabindex="-1"
         sec:authorize="hasRole('ADMINISTRADOR') or hasRole('EMPLEADO')">
        <div class="modal-dialog">
            <form th:action="@{${base}}" method="post" class="modal-content">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="modal-header">
                    <h5 class="modal-title">Nuevo producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Nombre</label>
                        <input name="nombre" class="form-control" required minlength="2" maxlength="100"
                               title="Ingresa un nombre válido (mínimo 2 caracteres)"></div>

                    <div class="mb-3"><label class="form-label">Stock</label>
                        <input type="number" name="stock" class="form-control" required min="0"
                               title="El stock no puede ser negativo"></div>

                    <div class="mb-3"><label class="form-label">Precio unitario</label>
                        <input type="number" step="0.01" name="precioUnitario" class="form-control" required min="0.01"
                               title="El precio debe ser mayor que cero"></div>

                    <div class="mb-3"><label class="form-label">Proveedor</label>
                        <select name="nombreProveedor" class="form-select" required>
                            <option value="" disabled selected>Selecciona un proveedor</option>
                            <option th:each="p : ${proveedores}" th:value="${p.nombre}" th:text="${p.nombre}"></option>
                        </select>
                    </div>

                    <div class="mb-3"><label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" required minlength="5" maxlength="255"
                                  title="Ingresa una descripción válida (mínimo 5 caracteres)"></textarea></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal editar -->
    <div class="modal fade" id="editarItem" tabindex="-1"
         sec:authorize="hasRole('ADMINISTRADOR')">
        <div class="modal-dialog">
            <form id="formEditar" method="post" class="modal-content">
                <input type="hidden" name="_method" value="put">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="modal-header">
                    <h5 class="modal-title">Editar producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="idInventario" name="idInventario">

                    <div class="mb-3"><label class="form-label">Nombre</label>
                        <input id="nombre" name="nombre" class="form-control" required minlength="2" maxlength="100"
                               title="Ingresa un nombre válido (mínimo 2 caracteres)"></div>

                    <div class="mb-3"><label class="form-label">Stock</label>
                        <input id="stock" type="number" name="stock" class="form-control" required min="0"
                               title="El stock no puede ser negativo"></div>

                    <div class="mb-3"><label class="form-label">Precio unitario</label>
                        <input id="precioUnitario" type="number" step="0.01" name="precioUnitario" class="form-control" required min="0.01"
                               title="El precio debe ser mayor que cero"></div>

                    <div class="mb-3"><label class="form-label">Proveedor</label>
                        <select id="nombreProveedor" name="nombreProveedor" class="form-select" required>
                            <option value="" disabled selected>Selecciona un proveedor</option>
                            <option th:each="p : ${proveedores}" th:value="${p.nombre}" th:text="${p.nombre}"></option>
                        </select>
                    </div>

                    <div class="mb-3"><label class="form-label">Descripción</label>
                        <textarea id="descripcion" name="descripcion" class="form-control" required minlength="5" maxlength="255"
                                  title="Ingresa una descripción válida (mínimo 5 caracteres)"></textarea></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Actualizar</button>
                </div>
            </form>
        </div>
    </div>

</div>
