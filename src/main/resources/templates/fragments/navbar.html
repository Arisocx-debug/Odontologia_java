<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-tooth"></i> Dr. Wilson Montenegro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/mision">Mision</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/vision">Vision</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/objetivos">Objetivos</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/servicios-publicos">Servicios</a></li>

                <!-- Menu Administrador -->
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" href="/admin/citas">Citas</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" href="/servicios">Servicios</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" href="/admin/inventario">Inventario</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" href="/admin/ventas">Ventas</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" href="/admin/proveedores">Proveedores</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" href="/admin/usuarios">Usuarios</a></li>

                <!-- Menu Empleado -->
                <li class="nav-item" sec:authorize="hasRole('EMPLEADO')"><a class="nav-link" href="/empleado/citas">Citas</a></li>
                <li class="nav-item" sec:authorize="hasRole('EMPLEADO')"><a class="nav-link" href="/servicios">Servicios</a></li>
                <li class="nav-item" sec:authorize="hasRole('EMPLEADO')"><a class="nav-link" href="/empleado/inventario">Inventario</a></li>
                <li class="nav-item" sec:authorize="hasRole('EMPLEADO')"><a class="nav-link" href="/empleado/ventas">Ventas</a></li>

                <!-- Menu Cliente -->
                <li class="nav-item" sec:authorize="hasRole('CLIENTE')"><a class="nav-link" href="/cliente/citas">Mis Citas</a></li>
                <li class="nav-item" sec:authorize="hasRole('CLIENTE')"><a class="nav-link" href="/cliente/inventario">Tienda</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/register">Registrarse</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link btn btn-light text-primary fw-bold ms-2 px-3" href="/login">Iniciar Sesion</a></li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-circle-user"></i> <span sec:authentication="name">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">Cerrar sesion</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
