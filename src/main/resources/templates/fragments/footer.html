<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="bg-dark text-light mt-5 pt-4 pb-3">
    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-3">
                <h5>Dr. Wilson Montenegro</h5>
                <p class="text-secondary">Odontologia General y Especializada</p>
            </div>
            <div class="col-md-4 mb-3">
                <h5>Contacto</h5>
                <p class="text-secondary mb-1"><i class="fa-solid fa-location-dot"></i> Dg. 84 #79 - 36, Engativa, Bogota</p>
                <p class="text-secondary mb-1"><i class="fa-brands fa-whatsapp"></i> 318 5377946</p>
                <p class="text-secondary mb-1"><i class="fa-solid fa-envelope"></i> wilsonmontenegroodontologia@gmail.com</p>
            </div>
            <div class="col-md-4 mb-3">
                <h5>Sistema</h5>
                <p class="text-secondary">Plataforma de gestion odontologica.</p>
            </div>
        </div>
        <hr class="border-secondary">
        <p class="text-center text-secondary mb-0">&copy; 2026 Dr. Wilson Montenegro. Todos los derechos reservados.</p>
    </div>
</footer>

<div th:fragment="alertas" class="container mt-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
