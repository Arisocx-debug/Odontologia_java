<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <footer th:fragment="footer">
        <div class="text-center py-3 text-muted">
            © 2026 Odontología - Todos los derechos reservados
        </div>
    </footer>

    <!-- Fragmento para scripts -->
    <div th:fragment="scripts">
        <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
        <script th:src="@{/js/main.js}"></script>
    </div>

    <!-- Fragmento para alertas -->
    <div th:fragment="alertas">

        <!-- Mensaje de éxito -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show text-center" role="alert">

            <span th:text="${success}"></span>

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <!-- Mensaje de error -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center" role="alert">

            <span th:text="${error}"></span>

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <!-- Mensaje informativo -->
        <div th:if="${mensaje}" class="alert alert-info alert-dismissible fade show text-center" role="alert">

            <span th:text="${mensaje}"></span>

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

    </div>
