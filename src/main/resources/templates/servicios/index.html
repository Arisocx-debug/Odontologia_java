<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Servicios')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/footer :: alertas}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-tooth text-primary"></i> Servicios Odontologicos</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalServicio">
            <i class="fa-solid fa-plus"></i> Nuevo servicio
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm">
            <thead class="table-primary">
            <tr><th>#</th><th>Nombre</th><th>Descripcion</th><th>Costo</th><th class="text-end">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${servicios}">
                <td th:text="${s.idServicio}"></td>
                <td th:text="${s.nombre}"></td>
                <td th:text="${s.descripcion}"></td>
                <td th:text="'$ ' + ${s.costo}"></td>
                <td class="text-end table-actions">
                    <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal"
                            th:data-bs-target="'#editar' + ${s.idServicio}"><i class="fa-solid fa-pen"></i></button>
                    <form th:action="@{'/servicios/' + ${s.idServicio}}" method="post" class="d-inline"
                          onsubmit="return confirm('Eliminar este servicio?');">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit" class="btn btn-sm btn-outline-dark"><i class="fa-solid fa-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(servicios)}">
                <td colspan="5" class="text-center text-muted py-4">No hay servicios registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Nuevo -->
<div class="modal fade" id="modalServicio" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/servicios}" method="post" class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Nuevo servicio</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Descripcion</label><textarea name="descripcion" class="form-control"></textarea></div>
                <div class="mb-3"><label class="form-label">Costo</label><input type="number" step="0.01" name="costo" class="form-control" required></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modales de edicion -->
<div class="modal fade" th:id="'editar' + ${s.idServicio}" tabindex="-1" th:each="s : ${servicios}">
    <div class="modal-dialog">
        <form th:action="@{'/servicios/' + ${s.idServicio}}" method="post" class="modal-content">
            <input type="hidden" name="_method" value="put">
            <div class="modal-header"><h5 class="modal-title">Editar servicio</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">Nombre</label>
                    <input name="nombre" class="form-control" th:value="${s.nombre}" required></div>
                <div class="mb-3"><label class="form-label">Descripcion</label>
                    <textarea name="descripcion" class="form-control" th:text="${s.descripcion}"></textarea></div>
                <div class="mb-3"><label class="form-label">Costo</label>
                    <input type="number" step="0.01" name="costo" class="form-control" th:value="${s.costo}" required></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Actualizar</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
