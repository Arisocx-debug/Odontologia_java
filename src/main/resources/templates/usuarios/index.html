<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Usuarios')}"></head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:replace="~{fragments/footer :: alertas}"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-users text-primary"></i> Usuarios del sistema</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                <i class="fa-solid fa-plus"></i> Nuevo usuario
            </button>
        </div>

        <form th:action="@{/admin/usuarios}" method="get" class="card shadow-sm border-0 mb-4">
            <div class="card-body"><div class="row g-3">
                <div class="col-md-4"><label class="form-label">Buscar</label><input type="text" name="search" th:value="${search}" class="form-control" placeholder="Nombre, correo o teléfono..."></div>
                <div class="col-md-3"><label class="form-label">Rol</label><select name="rol" class="form-select"><option value="">Todos</option><option th:each="r : ${roles}" th:value="${r}" th:selected="${rol == r}" th:text="${r}"></option></select></div>
                <div class="col-md-2"><label class="form-label">Estado</label><select name="estado" class="form-select"><option value="">Todos</option><option th:each="e : ${T(com.wilsonmontenegro.odontologia.model.enums.EstadoUsuario).values()}" th:value="${e}" th:selected="${estado == e}" th:text="${e}"></option></select></div>
                <div class="col-md-3"><label class="form-label">Desde</label><input type="date" name="fechaDesde" th:value="${fechaDesde}" class="form-control"></div>
                <div class="col-md-3"><label class="form-label">Hasta</label><input type="date" name="fechaHasta" th:value="${fechaHasta}" class="form-control"></div>
                <div class="col-md-6 d-flex align-items-end gap-2"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-filter"></i> Filtrar</button><a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">Limpiar</a></div>
            </div></div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover align-middle bg-white shadow-sm tabla-usuarios">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.name}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.telefono}"></td>
                        <td><span class="badge bg-primary" th:text="${u.rol}"></span></td>
                        <td>
                            <span class="badge" th:classappend="${u.activo} ? 'bg-success' : 'bg-secondary'"
                                th:text="${u.activo} ? 'ACTIVO' : 'INACTIVO'">
                            </span>
                        </td>
                        <td class="text-end table-actions">
                            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal"
                                th:data-bs-target="'#editarUser' + ${u.id}"><i class="fa-solid fa-pen"></i></button>

                            <form th:action="@{'/admin/usuarios/' + ${u.id} + '/estado'}" method="post"
                                class="d-inline">
                                <input type="hidden" name="_method" value="patch">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit"
                                    th:class="'btn btn-sm ' + (${u.activo} ? 'btn-outline-warning' : 'btn-outline-success')"
                                    th:title="${u.activo} ? 'Desactivar' : 'Activar'">
                                    <i class="fa-solid fa-power-off"></i>
                                </button>
                            </form>

                            <form th:action="@{'/admin/usuarios/' + ${u.id}}" method="post" class="d-inline"
                                onsubmit="return confirm('Eliminar este usuario?');">
                                <input type="hidden" name="_method" value="delete">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-sm btn-outline-dark"><i
                                        class="fa-solid fa-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{/admin/usuarios}" method="post" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control"
                            required></div>
                    <div class="mb-3"><label class="form-label">Correo</label><input type="email" name="email"
                            class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Teléfono</label><input name="telefono"
                            class="form-control" required></div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="rol" class="form-select" required>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" name="password"
                            class="form-control" required></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" th:id="'editarUser' + ${u.id}" tabindex="-1" th:each="u : ${usuarios}">
        <div class="modal-dialog">
            <form th:action="@{'/admin/usuarios/' + ${u.id}}" method="post" class="modal-content">
                <input type="hidden" name="_method" value="put">
                <div class="modal-header">
                    <h5 class="modal-title">Editar usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control"
                            th:value="${u.name}" required></div>
                    <div class="mb-3"><label class="form-label">Correo</label><input type="email" name="email"
                            class="form-control" th:value="${u.email}" required></div>
                    <div class="mb-3"><label class="form-label">Teléfono</label><input name="telefono"
                            class="form-control" th:value="${u.telefono}" required></div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="rol" class="form-select" required>
                            <option th:each="r : ${roles}" th:value="${r}" th:selected="${r == u.rol}" th:text="${r}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label">Nueva contraseña (opcional)</label><input
                            type="password" name="password" class="form-control"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Actualizar</button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>

</html>
