<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Ventas')}"></head>

<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div th:replace="~{fragments/footer :: alertas}"></div>


<div class="container py-4">

    <!-- =========================================================
         ENCABEZADO
         ========================================================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="fa-solid fa-cash-register text-primary"></i>
            Ventas
        </h2>

        <button
            type="button"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modalVenta">

            <i class="fa-solid fa-plus"></i>
            Registrar venta

        </button>

    </div>

    <form th:action="@{${base}}" method="get" class="card shadow-sm border-0 mb-4">
        <div class="card-body"><div class="row g-3">
            <div class="col-md-4"><label class="form-label">Buscar</label><input type="text" name="search" th:value="${search}" class="form-control" placeholder="Producto, comprador o correo..."></div>
            <div class="col-md-3"><label class="form-label">Producto</label><select name="productoId" class="form-select"><option value="">Todos</option><option th:each="producto : ${productos}" th:value="${producto.idInventario}" th:selected="${productoId != null and productoId == producto.idInventario}" th:text="${producto.nombre}"></option></select></div>
            <div class="col-md-2"><label class="form-label">Estado</label><select name="estado" class="form-select"><option value="">Todos</option><option th:each="e : ${T(com.wilsonmontenegro.odontologia.model.enums.EstadoVenta).values()}" th:value="${e}" th:selected="${estado == e}" th:text="${e}"></option></select></div>
            <div class="col-md-3"><label class="form-label">Desde</label><input type="date" name="fechaDesde" th:value="${fechaDesde}" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Hasta</label><input type="date" name="fechaHasta" th:value="${fechaHasta}" class="form-control"></div>
            <div class="col-md-6 d-flex align-items-end gap-2"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-filter"></i> Filtrar</button><a th:href="@{${base}}" class="btn btn-outline-secondary">Limpiar</a></div>
        </div></div>
    </form>

    <div class="d-flex justify-content-end gap-2 mb-3"><a th:href="@{${base + '/reporte/pdf'}(search=${search},productoId=${productoId},estado=${estado},fechaDesde=${fechaDesde},fechaHasta=${fechaHasta})}" class="btn btn-outline-danger"><i class="fa-solid fa-file-pdf"></i> PDF</a><a th:href="@{${base + '/reporte/excel'}(search=${search},productoId=${productoId},estado=${estado},fechaDesde=${fechaDesde},fechaHasta=${fechaHasta})}" class="btn btn-outline-success"><i class="fa-solid fa-file-excel"></i> Excel</a></div>

    <!-- =========================================================
         TABLA DE VENTAS
         ========================================================= -->

    <div class="table-responsive">

        <table class="table table-hover align-middle bg-white shadow-sm">

            <thead class="table-primary">

                <tr>

                    <th>#</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Descuento</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                    <th class="text-end">Acciones</th>

                </tr>

            </thead>


            <tbody>

                <!-- =================================================
                     VENTAS
                     ================================================= -->

                <tr th:each="v : ${ventas}">

                    <!-- ID -->

                    <td th:text="${v.idVenta}">
                        1
                    </td>


                    <!-- PRODUCTO -->

                    <td
                        th:text="${v.producto != null ? v.producto.nombre : 'Producto no disponible'}">

                        Producto

                    </td>


                    <!-- CANTIDAD -->

                    <td th:text="${v.cantidad}">
                        1
                    </td>


                    <!-- SUBTOTAL -->

                    <td th:text="|$ ${v.subtotal}|">
                        $ 0
                    </td>


                    <!-- DESCUENTO -->

                    <td th:text="|$ ${v.descuento}|">
                        $ 0
                    </td>


                    <!-- TOTAL -->

                    <td
                        class="fw-bold"
                        th:text="|$ ${v.total}|">

                        $ 0

                    </td>


                    <!-- ESTADO -->

                    <td>

                        <span
                            class="badge"
                            th:if="${v.estado != null}"
                            th:classappend="${v.estado.name() == 'ACTIVA'} ? 'bg-success' : 'bg-secondary'"
                            th:text="${v.estado}">

                            ACTIVA

                        </span>

                        <span
                            class="badge bg-secondary"
                            th:if="${v.estado == null}">

                            DESCONOCIDO

                        </span>

                    </td>


                    <!-- FECHA -->

                    <td
                        th:if="${v.createdAt != null}"
                        th:text="${#temporals.format(v.createdAt, 'dd/MM/yyyy HH:mm')}">

                        03/09/2026 13:00

                    </td>

                    <td
                        th:if="${v.createdAt == null}">

                        -

                    </td>


                    <!-- =================================================
                         ACCIONES
                         ================================================= -->

                    <td class="text-end table-actions">

                        <!-- PDF -->

                        <a
                            th:href="@{${base} + '/' + ${v.idVenta} + '/pdf'}"
                            target="_blank"
                            class="btn btn-sm btn-outline-danger"
                            title="Descargar PDF">

                            <i class="fa-solid fa-file-pdf"></i>

                        </a>


                        <!-- EXCEL -->

                        <a
                            th:href="@{${base} + '/' + ${v.idVenta} + '/excel'}"
                            class="btn btn-sm btn-outline-success"
                            title="Descargar Excel">

                            <i class="fa-solid fa-file-excel"></i>

                        </a>


                        <!-- ACTIVAR / DESACTIVAR -->

                        <form
                            th:action="@{${base} + '/' + ${v.idVenta} + '/estado'}"
                            method="post"
                            class="d-inline">

                            <input
                                type="hidden"
                                name="_method"
                                value="patch">

                            <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}">

                            <button
                                type="submit"
                                th:class="'btn btn-sm ' + (${v.estado != null and v.estado.name() == 'ACTIVA'} ? 'btn-outline-warning' : 'btn-outline-success')"
                                th:title="${v.estado != null and v.estado.name() == 'ACTIVA'} ? 'Inhabilitar venta' : 'Habilitar venta'">

                                <i class="fa-solid fa-power-off"></i>

                            </button>

                        </form>


                        <!-- ELIMINAR -->

                        <form
                            th:action="@{${base} + '/' + ${v.idVenta}}"
                            method="post"
                            class="d-inline"
                            onsubmit="return confirm('¿Eliminar esta venta?');">

                            <input
                                type="hidden"
                                name="_method"
                                value="delete">

                            <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}">

                            <button
                                type="submit"
                                class="btn btn-sm btn-outline-dark"
                                title="Eliminar venta">

                                <i class="fa-solid fa-trash"></i>

                            </button>

                        </form>

                    </td>

                </tr>


                <!-- =================================================
                     SIN VENTAS
                     ================================================= -->

                <tr th:if="${#lists.isEmpty(ventas)}">

                    <td
                        colspan="9"
                        class="text-center text-muted py-4">

                        <i class="fa-solid fa-receipt fa-2x mb-2"></i>

                        <br>

                        No hay ventas registradas.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- =========================================================
         MODAL REGISTRAR VENTA
         ========================================================= -->

    <div
        class="modal fade"
        id="modalVenta"
        tabindex="-1"
        aria-labelledby="modalVentaLabel"
        aria-hidden="true">

        <div class="modal-dialog">

            <form
                th:action="@{${base}}"
                method="post"
                class="modal-content">


                <!-- HEADER -->

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="modalVentaLabel">

                        <i class="fa-solid fa-cart-plus text-primary"></i>
                        Registrar venta

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                    </button>

                </div>


                <!-- BODY -->

                <div class="modal-body">


                    <!-- PRODUCTO -->

                    <div class="mb-3">

                        <label
                            for="idInventario"
                            class="form-label">

                            Producto

                        </label>

                        <select
                            id="idInventario"
                            name="idInventario"
                            class="form-select"
                            required>

                            <option
                                value=""
                                disabled
                                selected>

                                Selecciona un producto

                            </option>

                            <option
                                th:each="p : ${productos}"
                                th:value="${p.idInventario}"
                                th:text="|${p.nombre} (stock: ${p.stock}) - $${p.precioUnitario}|">

                                Producto

                            </option>

                        </select>

                    </div>


                    <!-- CANTIDAD -->

                    <div class="mb-3">

                        <label
                            for="cantidad"
                            class="form-label">

                            Cantidad

                        </label>

                        <input
                            id="cantidad"
                            type="number"
                            min="1"
                            name="cantidad"
                            class="form-control"
                            required>

                    </div>


                    <!-- DESCUENTO -->

                    <div class="mb-3">

                        <label
                            for="descuento"
                            class="form-label">

                            Descuento ($)

                        </label>

                        <input
                            id="descuento"
                            type="number"
                            step="0.01"
                            min="0"
                            name="descuento"
                            class="form-control"
                            value="0">

                    </div>

                </div>


                <!-- FOOTER -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="fa-solid fa-check"></i>
                        Registrar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer th:replace="~{fragments/footer :: footer}"></footer>

<div th:replace="~{fragments/footer :: scripts}"></div>

</body>
</html>
