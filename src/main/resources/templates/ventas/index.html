<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Ventas')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/footer :: alertas}"></div>

<div class="container py-4" sec:authorize="hasRole('ADMINISTRADOR')" th:with="base='/admin/ventas'">
    <div th:replace="~{this :: contenido(${base})}"></div>
</div>
<div class="container py-4" sec:authorize="hasRole('EMPLEADO')" th:with="base='/empleado/ventas'">
    <div th:replace="~{this :: contenido(${base})}"></div>
</div>

<div th:fragment="contenido(base)">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-cash-register text-primary"></i> Ventas</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalVenta">
            <i class="fa-solid fa-plus"></i> Registrar venta
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm">
            <thead class="table-primary">
            <tr><th>#</th><th>Producto</th><th>Cantidad</th><th>Subtotal</th><th>Descuento</th><th>Total</th><th>Fecha</th><th class="text-end">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="v : ${ventas}">
                <td th:text="${v.idVenta}"></td>
                <td th:text="${v.producto != null ? v.producto.nombre : 'Producto eliminado'}"></td>
                <td th:text="${v.cantidad}"></td>
                <td th:text="'$ ' + ${v.subtotal}"></td>
                <td th:text="'$ ' + ${v.descuento}"></td>
                <td th:text="'$ ' + ${v.total}"></td>
                <td th:text="${#temporals.format(v.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="text-end table-actions">
                    <a th:href="@{${base} + '/' + ${v.idVenta} + '/pdf'}" target="_blank" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-file-pdf"></i></a>
                    <a th:href="@{${base} + '/' + ${v.idVenta} + '/excel'}" class="btn btn-sm btn-outline-success"><i class="fa-solid fa-file-excel"></i></a>
                    <form th:action="@{${base} + '/' + ${v.idVenta}}" method="post" class="d-inline"
                          onsubmit="return confirm('Eliminar esta venta?');">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit" class="btn btn-sm btn-outline-dark"><i class="fa-solid fa-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(ventas)}">
                <td colspan="8" class="text-center text-muted py-4">No hay ventas registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="modalVenta" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{${base}}" method="post" class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Registrar venta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Producto</label>
                        <select name="idInventario" class="form-select" required>
                            <option th:each="p : ${productos}" th:value="${p.idInventario}"
                                    th:text="${p.nombre} + ' (stock: ' + ${p.stock} + ') - $' + ${p.precioUnitario}"></option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label">Cantidad</label><input type="number" min="1" name="cantidad" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Descuento ($)</label><input type="number" step="0.01" min="0" name="descuento" class="form-control" value="0"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Registrar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
