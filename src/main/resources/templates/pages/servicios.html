<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/app :: head('Servicios - Dr. Wilson Montenegro', '/css/style-servicios.css')}"></head>

<body>
    <header th:replace="~{layouts/app :: header('servicios-publicos')}"></header><br>
    <h1 class="title">NUESTROS SERVICIOS</h1><br>
    <section class="serviciosuwu">
        <div class="carrusel-contenedor"><input type="radio" name="slide" id="s1" checked><input type="radio"
                name="slide" id="s2"><input type="radio" name="slide" id="s3">
            <div class="carrusel">
                <div class="slide"><img th:src="@{/img/servicio1.jpg}" alt="Blanqueamiento Dental"></div>
                <div class="slide"><img th:src="@{/img/servicio2.jpg}" alt="Implantes Dentales"></div>
                <div class="slide"><img th:src="@{/img/servicio3.jpg}" alt="Ortodoncia"></div>
            </div>
            <div class="navegacion"><label for="s1" class="bar"></label><label for="s2" class="bar"></label><label
                    for="s3" class="bar"></label></div>
        </div>
    </section><br><br><br>
    <footer th:replace="~{layouts/app :: footer}"></footer>
</body>

</html>
